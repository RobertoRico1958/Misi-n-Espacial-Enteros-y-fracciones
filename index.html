<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webster Aprende</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#1f2937}header{background:#0f172a;color:white;text-align:center;padding:20px}main{max-width:900px;margin:auto;padding:16px}.card{background:white;padding:22px;border-radius:15px;margin:16px 0;box-shadow:0 3px 12px #0001}.hidden{display:none}button{padding:10px 15px;margin:5px;border:0;border-radius:9px;font-size:15px;cursor:pointer}.p{background:#1d4ed8;color:white}.s{background:#e2e8f0}.game{background:#7c3aed;color:white}input{padding:10px;font-size:17px;width:min(390px,100%);border:1px solid #bbb;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.topic{background:#eef4ff;border:1px solid #cbdcf7;text-align:left;padding:14px}.fb{padding:12px;border-radius:9px;margin-top:12px}.hint{background:#fef3c7}.bad{background:#fee2e2}.good{background:#dcfce7}.ref{background:#e0f2fe}.points{font-size:18px;background:#ede9fe;padding:10px 14px;border-radius:10px;display:inline-block}</style></head><body><header><h1>Escuela Webster</h1><div>WEBSTER APRENDE · Refuerzo Matemático</div></header><main>
<section class="card" id="start"><h2>Potencias, enteros, fracciones y decimales</h2><p>Las respuestas correctas generan puntos para desbloquear <b>Misión Espacial Webster</b>.</p><p class="points">⭐ Puntos: <b id="ptsStart">0</b></p><br><input id="name" placeholder="Nombre del estudiante"><h3>Ruta</h3><div class="grid"><button class="topic" onclick="begin('Todo')"><b>Recorrido completo</b></button><button class="topic" onclick="begin('Potencias')"><b>Potencias</b></button><button class="topic" onclick="begin('Propiedades')"><b>Propiedades</b></button><button class="topic" onclick="begin('Enteros')"><b>Enteros</b></button><button class="topic" onclick="begin('Fracciones')"><b>Fracciones</b></button><button class="topic" onclick="begin('Decimales')"><b>Decimales</b></button></div><p><button class="game" onclick="location.href='juego.html'">🚀 Ir al juego</button></p></section>
<section class="card hidden" id="work"><p class="points">⭐ Puntos: <b id="ptsWork">0</b></p><b id="topic"></b><p id="count"></p><h2 id="question"></h2><input id="ans" placeholder="Ejemplo: 1/2, 0.5 o -3"><button class="p" onclick="check()">Responder</button><button class="s" onclick="hint()">Ver pista</button><div id="fb" class="fb hidden"></div></section>
<section class="card hidden" id="result"><h2>Sesión terminada</h2><p class="points">⭐ Puntos acumulados: <b id="ptsResult">0</b></p><p><button class="game" onclick="location.href='juego.html'">🚀 Jugar Misión Espacial</button></p><button class="p" onclick="location.reload()">Nueva sesión</button></section></main>
<script>const ALL=[{"t": "Potencias", "q": "¿Cuánto vale 2⁵?", "a": 32, "h": "Multiplica 2 cinco veces.", "e": "2⁵ = 32.", "r": ["¿Cuánto vale 2³?", 8]}, {"t": "Potencias", "q": "¿Cuánto vale 7⁰?", "a": 1, "h": "Toda base distinta de cero elevada a 0 vale 1.", "e": "7⁰ = 1.", "r": ["¿Cuánto vale 5⁰?", 1]}, {"t": "Potencias", "q": "Calcula 2³·2²", "a": 32, "h": "Suma exponentes: 2³·2² = 2⁵.", "e": "2⁵ = 32.", "r": ["Calcula 2²·2¹", 8]}, {"t": "Potencias", "q": "Calcula (3²)²", "a": 81, "h": "Multiplica exponentes: 3⁴.", "e": "3⁴ = 81.", "r": ["Calcula (2²)²", 16]}, {"t": "Propiedades", "q": "En 8+(−3)=(−3)+8, escribe 1 si es conmutativa.", "a": 1, "h": "Cambió el orden de los sumandos.", "e": "Es la propiedad conmutativa.", "r": ["En 4+9=9+4, escribe 1 si es conmutativa.", 1]}, {"t": "Propiedades", "q": "¿Cuál es el inverso aditivo de −7?", "a": 7, "h": "Debe sumar cero con −7.", "e": "−7+7 = 0.", "r": ["¿Cuál es el inverso aditivo de 5?", -5]}, {"t": "Propiedades", "q": "Calcula usando distributiva: 3(4+2)", "a": 18, "h": "3·4+3·2.", "e": "12+6 = 18.", "r": ["Calcula 2(5+1)", 12]}, {"t": "Propiedades", "q": "¿Cuál es el elemento neutro de la multiplicación?", "a": 1, "h": "a·? = a.", "e": "a·1 = a.", "r": ["¿Cuál es el elemento neutro de la suma?", 0]}, {"t": "Enteros", "q": "Calcula −7+12", "a": 5, "h": "Signos distintos: resta 12−7.", "e": "−7+12 = 5.", "r": ["Calcula −3+8", 5]}, {"t": "Enteros", "q": "Calcula 6−(−4)", "a": 10, "h": "Restar un negativo equivale a sumar.", "e": "6−(−4) = 10.", "r": ["Calcula 5−(−2)", 7]}, {"t": "Enteros", "q": "Calcula (−6)(−3)", "a": 18, "h": "Negativo por negativo da positivo.", "e": "El resultado es 18.", "r": ["Calcula (−4)(−2)", 8]}, {"t": "Enteros", "q": "Calcula −3+2(5−1)", "a": 5, "h": "Primero paréntesis, luego multiplicación.", "e": "−3+2·4 = 5.", "r": ["Calcula −2+3(4−2)", 4]}, {"t": "Fracciones", "q": "Calcula 1/3+1/6", "a": 0.5, "h": "1/3 = 2/6.", "e": "3/6 = 1/2.", "r": ["Calcula 1/4+1/4", 0.5]}, {"t": "Fracciones", "q": "Calcula 3/4−1/8", "a": 0.625, "h": "3/4 = 6/8.", "e": "5/8 = 0.625.", "r": ["Calcula 3/4−1/4", 0.5]}, {"t": "Fracciones", "q": "Calcula (2/3)(3/5)", "a": 0.4, "h": "Multiplica numeradores y denominadores.", "e": "6/15 = 2/5.", "r": ["Calcula (1/2)(2/3)", 0.3333333333333333]}, {"t": "Fracciones", "q": "Calcula (3/4)÷(2/5)", "a": 1.875, "h": "Multiplica 3/4 por 5/2.", "e": "15/8 = 1.875.", "r": ["Calcula (1/2)÷(1/4)", 2]}, {"t": "Decimales", "q": "Calcula 4.75+2.6", "a": 7.35, "h": "Alinea decimales: 4.75+2.60.", "e": "Resultado: 7.35.", "r": ["Calcula 2.5+1.2", 3.7]}, {"t": "Decimales", "q": "Calcula 8.3−2.47", "a": 5.83, "h": "Escribe 8.30−2.47.", "e": "Resultado: 5.83.", "r": ["Calcula 5−1.25", 3.75]}, {"t": "Decimales", "q": "Calcula 0.6×0.4", "a": 0.24, "h": "6×4=24 y hay dos cifras decimales.", "e": "Resultado: 0.24.", "r": ["Calcula 0.5×0.2", 0.1]}, {"t": "Decimales", "q": "Calcula 3.6÷0.6", "a": 6, "h": "Equivale a 36÷6.", "e": "Resultado: 6.", "r": ["Calcula 2.4÷0.6", 4]}];let list=[],i=0,rem=false,tries=0,name='',puntos=Number(localStorage.getItem('websterPuntos'))||0;function sync(){['ptsStart','ptsWork','ptsResult'].forEach(id=>{let e=document.getElementById(id);if(e)e.textContent=puntos});localStorage.setItem('websterPuntos',puntos)}sync();function award(n){puntos+=n;sync();localStorage.setItem('websterUltimoAlumno',name)}function begin(t){name=document.getElementById('name').value.trim();if(!name)return alert('Escribe el nombre.');list=t==='Todo'?ALL:ALL.filter(x=>x.t===t);document.getElementById('start').classList.add('hidden');document.getElementById('work').classList.remove('hidden');show()}function val(x){x=x.trim().replace(',','.');if(x.includes('/')){let p=x.split('/');if(p.length==2&&+p[1]!=0)return +p[0]/+p[1]}let n=Number(x);return isNaN(n)?null:n}function show(){if(i>=list.length){document.getElementById('work').classList.add('hidden');document.getElementById('result').classList.remove('hidden');sync();return}tries=0;let q=list[i];document.getElementById('topic').textContent=rem?'Refuerzo · '+q.t:q.t;document.getElementById('count').textContent=(rem?'Refuerzo ':'Actividad ')+(i+1)+' de '+list.length;document.getElementById('question').textContent=rem?q.r[0]:q.q;document.getElementById('ans').value='';document.getElementById('fb').className='fb hidden'}function hint(){let q=list[i],f=document.getElementById('fb');f.className='fb hint';f.innerHTML='<b>Pista:</b> '+(rem?'Aplica la misma idea en un caso más sencillo.':q.h)}function check(){let q=list[i],x=val(document.getElementById('ans').value);if(x===null)return;tries++;let target=rem?q.r[1]:q.a,ok=Math.abs(x-target)<1e-7,f=document.getElementById('fb');if(ok){if(rem){award(5);f.className='fb good';f.innerHTML='<b>¡Refuerzo superado!</b> +5 puntos.';rem=false;i++}else{award(10);f.className='fb good';f.innerHTML='<b>¡Correcto!</b> '+q.e+' <b>+10 puntos</b>.';i++}setTimeout(show,800);return}if(tries===1){f.className='fb bad';f.innerHTML='<b>Aún no.</b> '+(rem?'Revisa con calma.':q.h)+'<br>Intenta una vez más.';return}if(!rem){f.className='fb ref';f.innerHTML='<b>Activamos un refuerzo.</b>';rem=true;setTimeout(show,900)}else{f.className='fb bad';f.innerHTML='<b>Este concepto necesita más práctica.</b>';rem=false;i++;setTimeout(show,900)}}document.getElementById('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check()});</script></body></html>
