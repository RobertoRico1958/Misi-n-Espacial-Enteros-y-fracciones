<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webster Aprende v5</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#1f2937}
header{background:#0f172a;color:white;text-align:center;padding:20px}
main{max-width:920px;margin:auto;padding:16px}
.card{background:white;padding:22px;border-radius:15px;margin:16px 0;box-shadow:0 3px 12px #0001}
.hidden{display:none}
button{padding:10px 15px;margin:5px;border:0;border-radius:9px;font-size:15px;cursor:pointer}
.p{background:#1d4ed8;color:white}.s{background:#e2e8f0}.g{background:#15803d;color:white}.game{background:#7c3aed;color:white}
input{padding:10px;font-size:17px;width:min(390px,100%);border:1px solid #bbb;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}
.topic{background:#eef4ff;border:1px solid #cbdcf7;text-align:left;padding:14px}
.fb{padding:12px;border-radius:9px;margin-top:12px}.hint{background:#fef3c7}.bad{background:#fee2e2}.good{background:#dcfce7}.ref{background:#e0f2fe}
.bar{height:15px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2563eb}
.points{font-size:18px;background:#ede9fe;padding:10px 14px;border-radius:10px;display:inline-block}
.notice{background:#dcfce7;color:#14532d;padding:12px;border-radius:9px;margin-bottom:12px}
.small{font-size:13px;color:#64748b}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid #cbd5e1;padding:7px}th{background:#e2e8f0}
</style>
</head>
<body>
<header><h1>Escuela Webster</h1><div>WEBSTER APRENDE · Versión aleatoria v5</div></header>
<main>

<section id="start" class="card">
<div id="notice"></div>
<h2>Refuerzo de Matemáticas</h2>
<p>Cada nuevo jugador recibe ejercicios diferentes generados automáticamente.</p>
<p class="points">⭐ Puntos: <b id="ptsStart">0</b></p><br><br>
<input id="name" placeholder="Nombre del estudiante">
<h3>Selecciona una ruta</h3>
<div class="grid">
<button class="topic" onclick="begin('Todo')"><b>Recorrido completo</b><br><span class="small">20 ejercicios: 4 por tema</span></button>
<button class="topic" onclick="begin('Potencias')"><b>Potencias</b><br><span class="small">8 ejercicios</span></button>
<button class="topic" onclick="begin('Propiedades')"><b>Propiedades</b><br><span class="small">8 ejercicios</span></button>
<button class="topic" onclick="begin('Enteros')"><b>Operaciones con enteros</b><br><span class="small">8 ejercicios</span></button>
<button class="topic" onclick="begin('Fracciones')"><b>Fracciones</b><br><span class="small">8 ejercicios</span></button>
<button class="topic" onclick="begin('Decimales')"><b>Decimales</b><br><span class="small">8 ejercicios</span></button>
</div>
<p><button class="game" onclick="location.href='juego_v4.html'">🚀 Ir a Misión Espacial Webster</button></p>
</section>

<section id="work" class="card hidden">
<p class="points">⭐ Puntos: <b id="ptsWork">0</b></p>
<b id="topic"></b><p id="counter"></p><h2 id="question"></h2>
<input id="answer" placeholder="Ejemplo: 1/2, 0.5 o -3">
<button class="p" onclick="check()">Responder</button>
<button class="s" onclick="showHint()">Ver pista</button>
<div id="feedback" class="fb hidden"></div>
</section>

<section id="result" class="card hidden">
<h2>Diagnóstico final</h2>
<p id="who"></p>
<p class="points">⭐ Puntos acumulados: <b id="ptsResult">0</b></p>
<div id="scores"></div>
<p id="adaptive"></p>
<div id="recommend" class="fb"></div>
<h3>Detalle de la sesión</h3>
<div id="table"></div>
<button class="game" onclick="location.href='juego_v4.html'">🚀 Jugar Misión Espacial</button>
<button class="g" onclick="newPractice()">🔄 Nueva práctica con otros ejercicios</button>
</section>
</main>

<script>
const TOPICS=['Potencias','Propiedades','Enteros','Fracciones','Decimales'];
const params=new URLSearchParams(location.search);

if(params.get('nuevo')==='1'){
 localStorage.removeItem('websterPuntos');
 localStorage.removeItem('websterMisiones');
 localStorage.removeItem('websterUltimoAlumno');
 localStorage.removeItem('websterSesion');
 history.replaceState({},'',location.pathname);
 document.getElementById('notice').className='notice';
 document.getElementById('notice').innerHTML='✅ Nuevo jugador: puntos en 0 y nueva sesión de ejercicios.';
}

let puntos=Number(localStorage.getItem('websterPuntos'))||0;
let name='',mode='',list=[],i=0,tries=0,rem=false,refs=0,refsOK=0,hist=[],scores={};

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[rnd(0,a.length-1)]}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return Math.abs(a)}
function frac(n,d){let g=gcd(n,d);return [n/g,d/g]}
function value(v){
 v=v.trim().replace(',','.');
 if(v.includes('/')){let p=v.split('/');if(p.length===2&&+p[1]!==0)return +p[0]/+p[1]}
 let n=Number(v);return isNaN(n)?null:n
}
function sync(){
 ['ptsStart','ptsWork','ptsResult'].forEach(id=>{let e=document.getElementById(id);if(e)e.textContent=puntos});
 localStorage.setItem('websterPuntos',String(puntos));
}
sync();

function genPower(simple=false){
 let type=rnd(1,4);
 if(type===1){
   let b=rnd(2,simple?4:6),e=rnd(2,simple?3:5),a=b**e;
   return {t:'Potencias',q:`Calcula ${b}^${e}`,a,h:`Multiplica ${b} por sí mismo ${e} veces.`,e:`${b}^${e} = ${a}.`};
 }
 if(type===2){
   let b=rnd(2,5),m=rnd(1,3),n=rnd(1,3),a=b**(m+n);
   return {t:'Potencias',q:`Calcula ${b}^${m} · ${b}^${n}`,a,h:'Al multiplicar potencias de igual base, suma exponentes.',e:`${b}^${m+n} = ${a}.`};
 }
 if(type===3){
   let b=rnd(2,4),m=rnd(3,5),n=rnd(1,m-1),a=b**(m-n);
   return {t:'Potencias',q:`Calcula ${b}^${m} ÷ ${b}^${n}`,a,h:'Al dividir potencias de igual base, resta exponentes.',e:`${b}^${m-n} = ${a}.`};
 }
 let b=rnd(2,4),m=rnd(2,3),n=rnd(2,3),a=b**(m*n);
 return {t:'Potencias',q:`Calcula (${b}^${m})^${n}`,a,h:'En potencia de una potencia, multiplica exponentes.',e:`${b}^${m*n} = ${a}.`};
}

function genProperty(simple=false){
 let type=rnd(1,4);
 if(type===1){
   let x=rnd(2,12);
   return {t:'Propiedades',q:`¿Cuál es el inverso aditivo de ${x}?`,a:-x,h:'Debe sumar cero con el número dado.',e:`${x}+(${-x})=0.`};
 }
 if(type===2){
   let x=-rnd(2,12);
   return {t:'Propiedades',q:`¿Cuál es el inverso aditivo de ${x}?`,a:-x,h:'Debe sumar cero con el número dado.',e:`${x}+${-x}=0.`};
 }
 if(type===3){
   let a=rnd(2,6),b=rnd(1,8),c=rnd(1,8),ans=a*(b+c);
   return {t:'Propiedades',q:`Calcula usando distributiva: ${a}(${b}+${c})`,a:ans,h:`${a}·${b}+${a}·${c}.`,e:`Resultado: ${ans}.`};
 }
 let which=rnd(0,1);
 return which===0
 ? {t:'Propiedades',q:'Escribe el elemento neutro de la suma.',a:0,h:'a + ? = a.',e:'El neutro aditivo es 0.'}
 : {t:'Propiedades',q:'Escribe el elemento neutro de la multiplicación.',a:1,h:'a · ? = a.',e:'El neutro multiplicativo es 1.'};
}

function genInteger(simple=false){
 let type=rnd(1,5);
 let a=rnd(2,simple?8:15),b=rnd(2,simple?8:15);
 if(type===1)return {t:'Enteros',q:`Calcula −${a}+${b}`,a:b-a,h:'Signos diferentes: resta valores absolutos.',e:`Resultado: ${b-a}.`};
 if(type===2)return {t:'Enteros',q:`Calcula ${a}−(−${b})`,a:a+b,h:'Restar un negativo equivale a sumar.',e:`Resultado: ${a+b}.`};
 if(type===3)return {t:'Enteros',q:`Calcula (−${a})(−${b})`,a:a*b,h:'Negativo por negativo da positivo.',e:`Resultado: ${a*b}.`};
 if(type===4)return {t:'Enteros',q:`Calcula (−${a*b})÷${b}`,a:-a,h:'Signos diferentes dan negativo.',e:`Resultado: ${-a}.`};
 let c=rnd(1,5),d=rnd(2,6),k=rnd(2,4),ans=-c+k*d;
 return {t:'Enteros',q:`Calcula −${c}+${k}(${d}+0)`,a:ans,h:'Primero multiplicación, después suma.',e:`Resultado: ${ans}.`};
}

function genFraction(simple=false){
 let type=rnd(1,4),d1=pick([2,3,4,5,6,8]),d2=pick([2,3,4,5,6,8]);
 let n1=rnd(1,d1-1),n2=rnd(1,d2-1);
 if(type===1){
   let ans=n1/d1+n2/d2;
   return {t:'Fracciones',q:`Calcula ${n1}/${d1} + ${n2}/${d2}`,a:ans,h:'Busca un denominador común.',e:`Resultado decimal: ${ans.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}.`};
 }
 if(type===2){
   if(n1/d1<n2/d2){[n1,n2]=[n2,n1];[d1,d2]=[d2,d1]}
   let ans=n1/d1-n2/d2;
   return {t:'Fracciones',q:`Calcula ${n1}/${d1} − ${n2}/${d2}`,a:ans,h:'Busca un denominador común.',e:`Resultado decimal: ${ans.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}.`};
 }
 if(type===3){
   let ans=(n1*n2)/(d1*d2);
   return {t:'Fracciones',q:`Calcula (${n1}/${d1})(${n2}/${d2})`,a:ans,h:'Multiplica numeradores y denominadores.',e:`Resultado decimal: ${ans.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}.`};
 }
 let ans=(n1/d1)/(n2/d2);
 return {t:'Fracciones',q:`Calcula (${n1}/${d1}) ÷ (${n2}/${d2})`,a:ans,h:'Multiplica por el recíproco de la segunda fracción.',e:`Resultado decimal: ${ans.toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}.`};
}

function genDecimal(simple=false){
 let type=rnd(1,4);
 let a=rnd(10,99)/10,b=rnd(10,99)/10;
 if(type===1){let ans=a+b;return {t:'Decimales',q:`Calcula ${a.toFixed(1)} + ${b.toFixed(1)}`,a:ans,h:'Alinea los puntos decimales.',e:`Resultado: ${ans.toFixed(1)}.`}}
 if(type===2){if(a<b)[a,b]=[b,a];let ans=a-b;return {t:'Decimales',q:`Calcula ${a.toFixed(1)} − ${b.toFixed(1)}`,a:ans,h:'Alinea los puntos decimales.',e:`Resultado: ${ans.toFixed(1)}.`}}
 if(type===3){a=rnd(2,9)/10;b=rnd(2,9)/10;let ans=a*b;return {t:'Decimales',q:`Calcula ${a.toFixed(1)} × ${b.toFixed(1)}`,a:ans,h:'Multiplica y cuenta cifras decimales.',e:`Resultado: ${ans.toFixed(2)}.`}}
 let divisor=rnd(2,9)/10,m=rnd(2,8),dividend=divisor*m;
 return {t:'Decimales',q:`Calcula ${dividend.toFixed(1)} ÷ ${divisor.toFixed(1)}`,a:m,h:'Mueve el decimal en ambos números hasta tener divisor entero.',e:`Resultado: ${m}.`};
}

function generator(t,simple=false){
 if(t==='Potencias')return genPower(simple);
 if(t==='Propiedades')return genProperty(simple);
 if(t==='Enteros')return genInteger(simple);
 if(t==='Fracciones')return genFraction(simple);
 return genDecimal(simple);
}
function build(m){
 let out=[];
 if(m==='Todo'){TOPICS.forEach(t=>{for(let k=0;k<4;k++)out.push(generator(t))})}
 else{for(let k=0;k<8;k++)out.push(generator(m))}
 return out.sort(()=>Math.random()-.5);
}

function begin(m){
 name=document.getElementById('name').value.trim();if(!name)return alert('Escribe el nombre.');
 mode=m;list=build(m);localStorage.setItem('websterUltimoAlumno',name);
 [...new Set(list.map(x=>x.t))].forEach(x=>scores[x]=[0,0]);
 document.getElementById('start').classList.add('hidden');document.getElementById('work').classList.remove('hidden');show();
}
function show(){
 if(i>=list.length)return finish();
 tries=0;
 let q=rem?generator(list[i].t,true):list[i];
 if(rem)list[i]._r=q;
 let cur=rem?list[i]._r:list[i];
 document.getElementById('topic').textContent=(rem?'Refuerzo · ':'')+cur.t;
 document.getElementById('counter').textContent=(rem?'Refuerzo de ':'Actividad ')+(i+1)+' de '+list.length;
 document.getElementById('question').textContent=cur.q;
 document.getElementById('answer').value='';document.getElementById('feedback').className='fb hidden';
}
function showHint(){
 let cur=rem?list[i]._r:list[i],f=document.getElementById('feedback');
 f.className='fb hint';f.innerHTML='<b>Pista:</b> '+cur.h;
}
function check(){
 let cur=rem?list[i]._r:list[i],x=value(document.getElementById('answer').value);if(x===null)return;
 tries++;let ok=Math.abs(x-cur.a)<0.00011,f=document.getElementById('feedback');
 if(ok){
   if(rem){puntos+=5;refsOK++;scores[cur.t][0]+=.5;scores[cur.t][1]++;hist.push([i+1,cur.t,'Refuerzo','Superado','+5']);rem=false;i++}
   else{puntos+=10;scores[cur.t][0]++;scores[cur.t][1]++;hist.push([i+1,cur.t,'Principal','Correcto','+10']);i++}
   sync();f.className='fb good';f.innerHTML='<b>¡Correcto!</b> '+cur.e+' Puntos obtenidos.';
   setTimeout(show,800);return;
 }
 if(tries===1){f.className='fb bad';f.innerHTML='<b>Aún no.</b> '+cur.h+'<br>Intenta una vez más.';return}
 if(!rem){hist.push([i+1,cur.t,'Principal','Necesita refuerzo','0']);refs++;rem=true;f.className='fb ref';f.innerHTML='<b>Activamos un ejercicio de refuerzo diferente.</b>';setTimeout(show,900)}
 else{scores[cur.t][1]++;hist.push([i+1,cur.t,'Refuerzo','Pendiente','0']);rem=false;i++;f.className='fb bad';f.innerHTML='<b>Este concepto necesita más práctica.</b>';setTimeout(show,900)}
}
function pct(t){let x=scores[t];return x&&x[1]?Math.round(100*x[0]/x[1]):0}
function finish(){
 document.getElementById('work').classList.add('hidden');document.getElementById('result').classList.remove('hidden');sync();
 document.getElementById('who').innerHTML='<b>'+name+'</b>, estos son tus resultados.';
 let h='',r=[];Object.keys(scores).forEach(t=>{let p=pct(t);h+=`<h4>${t}: ${p}%</h4><div class="bar"><div class="fill" style="width:${p}%"></div></div>`;if(p<70)r.push('Reforzar '+t.toLowerCase()+'.')});
 if(!r.length)r.push('Buen dominio general. Puedes avanzar a ejercicios combinados.');
 document.getElementById('scores').innerHTML=h;
 document.getElementById('adaptive').innerHTML='<b>Refuerzos activados:</b> '+refs+' · <b>superados:</b> '+refsOK;
 document.getElementById('recommend').innerHTML='<b>Recomendación:</b><br>'+r.map(x=>'• '+x).join('<br>');
 let t='<table><tr><th>#</th><th>Tema</th><th>Tipo</th><th>Resultado</th><th>Puntos</th></tr>';
 hist.forEach(x=>t+='<tr>'+x.map(y=>'<td>'+y+'</td>').join('')+'</tr>');
 document.getElementById('table').innerHTML=t+'</table>';
}
function newPractice(){
 list=build(mode);i=0;tries=0;rem=false;refs=0;refsOK=0;hist=[];scores={};
 [...new Set(list.map(x=>x.t))].forEach(x=>scores[x]=[0,0]);
 document.getElementById('result').classList.add('hidden');document.getElementById('work').classList.remove('hidden');show();
}
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script>
</body>
</html>
